services:
  mongo:
    image: mongo:8
    command: ["mongod", "--port", "27027", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27027:27027"]
    volumes: ["tjp-mongo:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27027 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27027\"}]}) }'"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  tjp-mongo:

